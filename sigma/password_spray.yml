title: Password Spray (one source, many accounts)
id: 9f1b0c2a-0002-4a10-9a30-siemlab000002
status: experimental
description: >
  One source address generating failed authentications against many
  distinct accounts within a window, low-and-slow per account but broad
  across accounts. Threshold SPRAY_MIN_USERS distinct users in
  SPRAY_WINDOW.
logsource:
  product: linux
  service: auth
detection:
  failures:
    outcome: failure
  timeframe: 15m
  condition: failures | count_distinct(user) by src_ip >= 4
fields:
  - src_ip
  - user
  - host
falsepositives:
  - A shared NAT source for many legitimate users (avoided in the lab by
    giving each user a distinct source)
level: medium
