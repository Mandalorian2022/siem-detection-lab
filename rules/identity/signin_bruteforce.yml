title: Slow brute force from rotating addresses
id: 6010dc9d-7200-4e43-9318-ff0388502bd5
name: signin_slow_bruteforce
status: experimental
description: |
  Twenty or more failures for one account over four hours regardless of
  source. Catches guessing that rotates addresses and paces itself under
  the per-address threshold. The four-hour window is the price of the
  low rate; a determined attacker can pace below it (see the documented gap).
author: Reza Faraji
date: 2026-10-20
correlation:
  type: event_count
  rules:
    - signin_failure
  group-by:
    - UserPrincipalName
  timespan: 4h
  condition:
    gte: 20
level: medium
falsepositives:
  - A shared mailbox whose password changed while several devices still hold the old one
tags:
  - attack.credential_access
  - attack.t1110.001
