title: Password spray from a single address
id: 1da42915-0907-4ab3-a0ce-126d114204b6
name: signin_password_spray
status: stable
description: |
  One source address fails sign-in against many distinct accounts inside an
  hour. The corporate egress is excluded by the building block, because a
  whole office mistyping passwords at 8 a.m. looks exactly like a spray.
author: Reza Faraji
date: 2026-10-20
correlation:
  type: value_count
  rules:
    - signin_failure
  group-by:
    - IpAddress
  timespan: 1h
  condition:
    field: UserPrincipalName
    gte: 10
level: high
falsepositives:
  - A NAT gateway or proxy that fronts many users and is not yet on the corporate allowlist
tags:
  - attack.credential_access
  - attack.t1110.003
