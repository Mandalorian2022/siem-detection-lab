---
title: Long hexadecimal TXT query (building block)
id: 0d92dcf7-3077-4246-93cf-049b44f5ca04
name: dns_long_txt_query
status: stable
description: |
  A TXT lookup whose first label is forty or more hex characters, outside
  the allowlisted suffixes. One is nothing; a stream is a tunnel.
author: Reza Faraji
date: 2026-10-20
logsource:
  category: dns
detection:
  selection:
    record_type: TXT
    query|re: '^[0-9a-f]{40,}\.'
    dns.question.allowlisted: false
  condition: selection
level: informational
x-building-block: true
tags:
  - attack.command_and_control
  - attack.t1071.004
---
title: High-volume long-label DNS queries
id: 7e89cf5b-9cef-4b96-95a4-950502e5e0fc
name: dns_long_label_query
status: stable
description: |
  Sixty or more long hexadecimal TXT queries from one host in fifteen
  minutes. Endpoint security products do this legitimately, which is why
  their domains are allowlisted in the building block rather than here.
author: Reza Faraji
date: 2026-10-20
correlation:
  type: event_count
  rules:
    - dns_long_txt_query
  group-by:
    - Hostname
  timespan: 15m
  condition:
    gte: 60
level: high
falsepositives:
  - A new security agent whose lookup domain is not yet allowlisted
tags:
  - attack.command_and_control
  - attack.exfiltration
  - attack.t1071.004
