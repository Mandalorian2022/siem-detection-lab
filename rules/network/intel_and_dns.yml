title: DNS query for a domain on the threat-intel list
id: 1feeafde-1bd4-48b3-9f3d-0122d9f496d0
name: dns_query_intel_domain
status: stable
description: A host resolved a domain that threat intelligence lists as malicious.
author: Reza Faraji
date: 2026-10-20
logsource:
  category: dns
detection:
  selection:
    dns.question.ti_category|exists: true
  condition: selection
level: high
falsepositives:
  - Security tooling that resolves indicators on purpose (sandboxes, enrichment jobs)
tags:
  - attack.command_and_control
  - attack.t1071
