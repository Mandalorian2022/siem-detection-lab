name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check src tests
      - name: types
        run: mypy src
      - name: validate rules
        run: siemlab validate
      - name: tests
        run: pytest --cov=siemlab --cov-report=term-missing --cov-report=xml
      - name: end-to-end, strict
        run: siemlab --build build all --seed 7 --strict
      - name: second seed must also pass
        run: siemlab --build build2 all --seed 23 --strict
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: evaluation-report
          path: |
            build/report.md
            build/report.html
            build/report.json
            build/incidents.json
